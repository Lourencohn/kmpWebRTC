app = "trovatacast-signaling"
primary_region = "gru"

[build]

[env]
  PORT = "8080"
  STATIC_DIR = "/app/static"
  PUBLIC_CATALOG_URL = "https://trovata.app.br"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 200
    soft_limit = 150

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "15s"
  method = "get"
  path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
